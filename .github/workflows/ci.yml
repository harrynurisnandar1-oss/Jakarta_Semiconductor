name: Security - CMake + CTest

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

# GitHub Actions only needs to read the repository.
permissions:
  contents: read

env:
  SECURITY_DIR: "Harry Nur Isnandar/Catatan dan Hasil/Security"
  BUILD_DIR: "build-security"

jobs:
  build-and-test:
    name: Build and Test - Ubuntu
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Checkout repository
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. Install build and crypto dependencies
      # ==========================================================
      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            cmake \
            ninja-build \
            gcc \
            g++ \
            libssl-dev \
            pkg-config

      # ==========================================================
      # 3. Display toolchain versions
      # ==========================================================
      - name: Show toolchain versions
        shell: bash
        run: |
          echo "=== GCC ==="
          gcc --version

          echo "=== CMake ==="
          cmake --version

          echo "=== OpenSSL ==="
          openssl version

          echo "=== Ninja ==="
          ninja --version

      # ==========================================================
      # 4. Configure CMake
      # ==========================================================
      - name: Configure CMake
        shell: bash
        run: |
          cmake \
            -S "$SECURITY_DIR" \
            -B "$BUILD_DIR" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_STANDARD=11 \
            -DCMAKE_C_STANDARD_REQUIRED=ON \
            -DCMAKE_C_EXTENSIONS=OFF

      # ==========================================================
      # 5. Build project
      # ==========================================================
      - name: Build
        shell: bash
        run: |
          cmake \
            --build "$BUILD_DIR" \
            --parallel

      # ==========================================================
      # 6. Run CTest
      # ==========================================================
      - name: Run CTest
        shell: bash
        run: |
          ctest \
            --test-dir "$BUILD_DIR" \
            --output-on-failure \
            --parallel 2

      # ==========================================================
      # 7. Upload CTest results
      # ==========================================================
      - name: Upload CTest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-results-ubuntu
          path: |
            ${{ env.BUILD_DIR }}/Testing/
          if-no-files-found: ignore
          retention-days: 14

      # ==========================================================
      # 8. Show build directory if the job fails
      # ==========================================================
      - name: Show build files on failure
        if: failure()
        shell: bash
        run: |
          echo "=== Build directory ==="
          find "$BUILD_DIR" -maxdepth 3 -type f 2>/dev/null || true